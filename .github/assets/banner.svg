<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">iVibe</title>
  <desc id="desc">iVibe: show the bug, get the fix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b1a"/>
      <stop offset="1" stop-color="#16112e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#c04cfd"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- Wordmark -->
  <text x="96" y="178" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-3" fill="#ffffff">i<tspan fill="url(#accent)">Vibe</tspan></text>
  <text x="100" y="236" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#e8e6f5">Show the bug. Get the fix.</text>
  <text x="100" y="280" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#a39fc0">Screen + voice in, root cause with proof frames out. Private by design.</text>

  <!-- Frame strip: a bug unfolding over time, with the break moment highlighted -->
  <g transform="translate(760 96)" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">
    <g>
      <rect width="120" height="80" rx="10" fill="#1f1a3d" stroke="#3a3366"/>
      <rect x="14" y="16" width="60" height="8" rx="4" fill="#4b4380"/>
      <rect x="14" y="32" width="88" height="8" rx="4" fill="#3a3366"/>
      <rect x="14" y="52" width="40" height="16" rx="5" fill="#7c5cff"/>
      <text x="0" y="104" fill="#8f8aa8">00:01.2</text>
    </g>
    <g transform="translate(140 0)">
      <rect width="120" height="80" rx="10" fill="#1f1a3d" stroke="#3a3366"/>
      <circle cx="60" cy="40" r="14" fill="none" stroke="#7c5cff" stroke-width="4" stroke-dasharray="60 30"/>
      <text x="0" y="104" fill="#8f8aa8">00:02.6</text>
    </g>
    <g transform="translate(280 0)">
      <rect width="120" height="80" rx="10" fill="#1f1a3d" stroke="url(#accent)" stroke-width="3"/>
      <rect x="10" y="48" width="100" height="20" rx="4" fill="#ff5c8a" fill-opacity="0.25" stroke="#ff5c8a"/>
      <rect x="18" y="55" width="70" height="6" rx="3" fill="#ff5c8a"/>
      <rect x="14" y="16" width="60" height="8" rx="4" fill="#4b4380"/>
      <text x="0" y="104" fill="#ff8fb0">00:03.9 ● break</text>
    </g>
  </g>
  <path d="M760 236 H1160" stroke="#3a3366" stroke-width="2" stroke-dasharray="4 8"/>
</svg>
