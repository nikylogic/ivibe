packages:
  - "apps/*"
  - "packages/*"

# Install scripts: Electron and ONNX Runtime for Node (OCR tests) download binaries.
allowBuilds:
  electron: true
  onnxruntime-node: true
  # Version check only.
  protobufjs: false
  # Prints a setup hint only.
  "@astryxdesign/core": false
  # Squirrel.Windows tooling; we package with NSIS.
  electron-winstaller: false
  # Vite 8 bundles with Rolldown; esbuild is optional and its platform package ships the binary.
  esbuild: false
