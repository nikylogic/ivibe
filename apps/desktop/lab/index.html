<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iVibe App Lab</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --panel: #fdfcf9;
        --text: #1b1a17;
        --muted: #6f6a60;
        --line: #d9d4c9;
        --on: #1b1a17;
        --on-text: #fdfcf9;
        --hover: #efebe3;
      }
      :root[data-theme="dark"] {
        --bg: #121110;
        --panel: #1a1917;
        --text: #f2efe8;
        --muted: #a39e94;
        --line: #3a3833;
        --on: #f2efe8;
        --on-text: #121110;
        --hover: #22211e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr) 260px;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.4 "Inter Variable",
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      aside {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--panel);
      }
      #list-side {
        border-right: 1px solid var(--line);
      }
      #log-side {
        border-left: 1px solid var(--line);
      }
      header {
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0 0 8px;
        font:
          400 24px/1.1 "Instrument Serif",
          Georgia,
          serif;
      }
      #search {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      #count {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      nav {
        flex: 1;
        overflow-y: auto;
        padding: 6px 8px 24px;
      }
      nav h2 {
        margin: 14px 8px 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }
      button {
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      nav button {
        display: block;
        width: 100%;
        padding: 5px 8px;
        border-radius: 7px;
        text-align: left;
      }
      nav button:hover {
        background: var(--hover);
      }
      nav button[data-on] {
        background: var(--on);
        color: var(--on-text);
      }
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      #bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
      }
      #title {
        margin-right: auto;
        font-weight: 600;
      }
      #size-note {
        color: var(--muted);
        font-size: 12px;
      }
      .pick {
        display: flex;
        padding: 2px;
        border-radius: 8px;
        background: var(--hover);
      }
      .pick button,
      #reload {
        padding: 3px 9px;
        border-radius: 6px;
        text-transform: capitalize;
      }
      .pick button[data-on] {
        background: var(--panel);
        font-weight: 600;
      }
      #reload {
        background: var(--hover);
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      /* A pretend desktop: the pill's window is see-through. */
      #stage[data-window="hud"] {
        background: linear-gradient(140deg, #6d7f8c, #c9b8a0 60%, #8f7d6c);
      }
      #frame {
        position: absolute;
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        border: 0;
        background: transparent;
        color-scheme: normal;
      }
      #stage[data-window="ui"] #frame {
        border-radius: 10px;
        box-shadow:
          0 0 0 1px var(--line),
          0 18px 50px #00000033;
      }
      #log-side header {
        font-weight: 600;
      }
      #log-side p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px;
        font:
          12px/1.5 ui-monospace,
          Consolas,
          monospace;
        overflow-wrap: anywhere;
      }
      #log div {
        padding: 3px 0;
        border-bottom: 1px solid var(--hover);
      }
    </style>
  </head>
  <body>
    <aside id="list-side">
      <header>
        <h1>App Lab</h1>
        <input id="search" placeholder="Find a screen" aria-label="Find a screen" />
        <div id="count"></div>
      </header>
      <nav id="nav"></nav>
    </aside>
    <main>
      <div id="bar">
        <span id="title"></span>
        <span id="size-note"></span>
        <div class="pick" id="size"></div>
        <div class="pick" id="theme"></div>
        <button id="reload">Restart</button>
      </div>
      <div id="stage"><iframe id="frame" title="The app" allowtransparency="true"></iframe></div>
    </main>
    <aside id="log-side">
      <header>
        What the app did
        <p>Everything is pretend. No real account, key or server is touched.</p>
      </header>
      <div id="log"></div>
    </aside>
    <script type="module" src="./lab.ts"></script>
  </body>
</html>
